name: Release

# Construiește, testează și publică release-ul la fiecare tag v* (ex. v1.0.0).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag-ul pentru care se construiește release-ul (ex. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Teste
        run: dotnet test OrarStudio.slnx -c Release

      - name: Publicare (un singur fișier, fără .NET instalat)
        run: >
          dotnet publish src/OrarStudio -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o dist/OrarStudio

      - name: Arhivă
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $zip = "OrarStudio-$version-win-x64.zip"
          Compress-Archive -Path dist/OrarStudio -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tolerant la erorile temporare ale GitHub: ciorna rămasă de la o rulare eșuată se refolosește,
          # iar fiecare pas se reîncearcă de câteva ori înainte de a renunța.
          function Invoke-WithRetry([string]$What, [scriptblock]$Action) {
            for ($i = 1; $i -le 5; $i++) {
              & $Action
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "::warning::$What a eșuat (încercarea $i din 5)"
              if ($i -lt 5) { Start-Sleep -Seconds (30 * $i) }
            }
            throw "$What a eșuat de 5 ori"
          }

          Invoke-WithRetry 'Crearea release-ului' {
            gh release view $env:TAG --json tagName *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $env:TAG --draft --verify-tag --title "Orar Studio $env:VERSION" --notes-file .github/release-notes.md
            }
          }
          Invoke-WithRetry 'Încărcarea arhivei' { gh release upload $env:TAG $env:ZIP --clobber }
          Invoke-WithRetry 'Publicarea release-ului' { gh release edit $env:TAG --draft=false }
